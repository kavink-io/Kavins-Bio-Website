<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="neonBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#neonBg)" />
  
  <!-- Outer Glow Hex / Circle Pattern -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#cyberBorder)" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.4" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#cyberBorder)" stroke-width="3" filter="url(#glow)" opacity="0.6" />

  <!-- Developer Silhouette with Tech Elements -->
  <g transform="translate(0, 15)">
    <!-- Shoulders / Torso -->
    <path d="M 120 330 C 120 270, 150 250, 200 250 C 250 250, 280 270, 280 330 Z" fill="url(#avatarGrad)" opacity="0.75" />
    <!-- Collar / Hoodie V -->
    <path d="M 175 255 L 200 285 L 225 255" fill="none" stroke="#030712" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Neck -->
    <rect x="186" y="215" width="28" height="40" rx="6" fill="#38bdf8" opacity="0.85" />
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="46" ry="54" fill="url(#avatarGrad)" />
    <!-- Stylized Hair -->
    <path d="M 152 170 C 150 120, 250 115, 248 170 C 240 135, 160 135, 152 170 Z" fill="#0f172a" />
    <path d="M 156 160 Q 200 120 244 160" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8" />
    <!-- Futuristic Visor / Glasses / Coding Headset -->
    <rect x="165" y="170" width="70" height="18" rx="8" fill="#030712" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="172" y1="179" x2="228" y2="179" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="152" cy="180" r="8" fill="#38bdf8" />
    <circle cx="248" cy="180" r="8" fill="#38bdf8" />
    <path d="M 152 180 Q 200 110 248 180" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6" />
  </g>

  <!-- Tech Badges Overlaid -->
  <g transform="translate(45, 335)">
    <rect width="125" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="62" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;React /&gt;</text>
  </g>
  
  <g transform="translate(230, 335)">
    <rect width="125" height="30" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <text x="62" y="20" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;Python /&gt;</text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(130, 30)">
    <rect width="140" height="26" rx="13" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
    <circle cx="145" cy="43" r="4.5" fill="#22c55e" />
    <text x="200" y="47" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open to Work</text>
  </g>

  <!-- Replace hint watermark -->
  <text x="200" y="388" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" opacity="0.7">
    Replace: public/profile.jpg
  </text>
</svg>
